<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Market - Top Up Game Resmi & Terpercaya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 12px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .grid-nominal {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        .nominal-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nominal-item:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .nominal-item.active {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
        }

        .nominal-item span {
            display: block;
            font-size: 14px;
        }

        .nominal-item small {
            font-size: 11px;
            opacity: 0.8;
        }

        .btn-order {
            width: 100%;
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .btn-order:hover {
            background: #16a34a;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Day Market</h1>
        <p>Top Up Free Fire Cepat, Murah & Aman</p>
    </div>

    <div class="form-group">
        <label for="userId">Masukkan User ID Game</label>
        <input type="number" id="userId" placeholder="Contoh: 2513759655" required>
    </div>

    <div class="form-group">
        <label>Pilih Nominal Diamond</label>
        <div class="grid-nominal" id="nominalGroup">
            <div class="nominal-item" onclick="selectNominal(this, '50 Diamonds', 'Rp 8.000')">
                <span>50 Diamonds</span>
                <small>Rp 8.000</small>
            </div>
            <div class="nominal-item" onclick="selectNominal(this, '70 Diamonds', 'Rp 11.000')">
                <span>70 Diamonds</span>
                <small>Rp 11.000</small>
            </div>
            <div class="nominal-item" onclick="selectNominal(this, '140 Diamonds', 'Rp 21.000')">
                <span>140 Diamonds</span>
                <small>Rp 21.000</small>
            </div>
            <div class="nominal-item" onclick="selectNominal(this, '355 Diamonds', 'Rp 52.000')">
                <span>355 Diamonds</span>
                <small>Rp 52.000</small>
            </div>
            <div class="nominal-item" onclick="selectNominal(this, '720 Diamonds', 'Rp 103.000')">
                <span>720 Diamonds</span>
                <small>Rp 103.000</small>
            </div>
            <div class="nominal-item" onclick="selectNominal(this, '1.440 Diamonds', 'Rp 200.000')">
                <span>1.440 Diamonds</span>
                <small>Rp 200.000</small>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="payment">Metode Pembayaran</label>
        <select id="payment">
            <option value="DANA">DANA</option>
            <option value="OVO">OVO</option>
            <option value="GOPAY">GOPAY</option>
            <option value="QRIS">QRIS (All e-Wallet)</option>
        </select>
    </div>

    <button class="btn-order" onclick="kirimOrder()">
        🚀 Kirim Orderan via WhatsApp
    </button>

    <div class="footer">
        &copy; 2026 Day Market. All Rights Reserved.
    </div>
</div>

<script>
    // ⚠️ GANTI TEKS DI BAWAH INI JADI NOMOR WHATSAPP ANDA (Wajib pakai kode negara 62)
    const NOMOR_WA_ADMIN = "6287736058793"; 

    let nominalTerpilih = "";
    let hargaTerpilih = "";

    function selectNominal(element, nominal, harga) {
        const items = document.querySelectorAll('.nominal-item');
        items.forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        
        nominalTerpilih = nominal;
        hargaTerpilih = harga;
    }

    function kirimOrder() {
        const idUser = document.getElementById('userId').value;
        const metodeBayar = document.getElementById('payment').value;

        if (!idUser) {
            alert('Mohon masukkan User ID Game Anda terlebih dahulu!');
            return;
        }
        if (!nominalTerpilih) {
            alert('Mohon pilih nominal Diamond yang ingin dibeli!');
            return;
        }

        // Penyusunan teks pesan otomatis yang rapi
        const teksPesan = "Halo Day Market, saya mau top-up game:\n\n" +
                          "🎮 *Game:* Free Fire\n" +
                          "🆔 *User ID:* " + idUser + "\n" +
                          "🌐 *Server:* -\n" +
                          "💎 *Nominal:* " + nominalTerpilih + "\n" +
                          "💰 *Harga:* " + hargaTerpilih + "\n" +
                          "💳 *Metode:* " + metodeBayar;

        // FITUR UTAMA: Mengunci teks agar aman dan TIDAK KEPOTONG di Android
        const linkWhatsApp = "https://api.whatsapp.com/send?phone=" + NOMOR_WA_ADMIN + "&text=" + encodeURIComponent(teksPesan);

        window.open(linkWhatsApp, '_blank');
    }
</script>

</body>
</html>
